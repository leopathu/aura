version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurasecret}
      POSTGRES_DB: ${POSTGRES_DB:-aura_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aura-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: aura-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:-aurasecret}@postgres:5432/${POSTGRES_DB:-aura_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-aura-production-secret-key-replace-in-env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-b'G4_yZ0RkL1f_hXq3c8s-Uq7m8Lz4pQ1X3y2a5W9rT7A='}
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - api_storage:/app/storage

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-worker
    restart: unless-stopped
    command: python -m app.worker.tasks
    depends_on:
      - api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:-aurasecret}@postgres:5432/${POSTGRES_DB:-aura_db}
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-b'G4_yZ0RkL1f_hXq3c8s-Uq7m8Lz4pQ1X3y2a5W9rT7A='}
      STORAGE_DIR: /app/storage
    volumes:
      - api_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aura-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  api_storage:
